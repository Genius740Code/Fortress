name: Deploy Fortress API

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fortress-api

jobs:
  # Security and quality checks
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Cache cargo dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Run security audit
      run: cargo audit --deny warnings

    - name: Check for outdated dependencies
      run: cargo outdated --root-deps

  # Code quality checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        components: rustfmt, clippy
        override: true

    - name: Cache cargo dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Check code formatting
      run: cargo fmt --all -- --check

    - name: Run clippy lints
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Check documentation
      run: cargo doc --no-deps --all-features

  # Run tests
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: ${{ matrix.rust }}
        override: true

    - name: Cache cargo dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Run unit tests
      run: cargo test --all-features --verbose

    - name: Run integration tests
      run: cargo test --test integration --all-features --verbose

    - name: Generate coverage report
      uses: actions-rs/tarpaulin@v0.1
      with:
        version: '0.22.0'
        args: '--all-features --workspace --out Xml'

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  # Build and push Docker image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [security-audit, code-quality, test]
    if: github.event_name != 'pull_request'
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_DATE=${{ steps.meta.outputs.date }}
          VCS_REF=${{ github.ref }}
          VCS_SHA=${{ github.sha }}

    - name: Output image
      id: image
      run: |
        echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}" >> $GITHUB_OUTPUT

  # Deploy to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

    - name: Deploy to staging
      run: |
        # Update deployment with new image
        kubectl set image deployment/fortress-api fortress-api=${{ needs.build.outputs.image }} -n fortress-staging
        
        # Wait for rollout to complete
        kubectl rollout status deployment/fortress-api -n fortress-staging --timeout=300s
        
        # Verify deployment
        kubectl get pods -n fortress-staging -l app=fortress-api

    - name: Run smoke tests
      run: |
        # Wait for pods to be ready
        kubectl wait --for=condition=ready pod -l app=fortress-api -n fortress-staging --timeout=300s
        
        # Get service URL
        SERVICE_URL=$(kubectl get service fortress-api-service -n fortress-staging -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        
        # Run smoke tests
        curl -f $SERVICE_URL/health || exit 1
        curl -f $SERVICE_URL/health/detailed || exit 1
        curl -f $SERVICE_URL/health/security || exit 1

  # Deploy to production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: github.ref == 'refs/heads/main' && startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

    - name: Create backup before deployment
      run: |
        # Create database backup
        kubectl exec -n fortress postgres-0 -- pg_dump fortress > fortress-backup-$(date +%Y%m%d-%H%M%S).sql
        
        # Create Redis backup
        kubectl exec -n fortress deployment/redis -- redis-cli BGSAVE

    - name: Deploy to production
      run: |
        # Update deployment with new image
        kubectl set image deployment/fortress-api fortress-api=${{ needs.build.outputs.image }} -n fortress
        
        # Wait for rollout to complete
        kubectl rollout status deployment/fortress-api -n fortress --timeout=600s
        
        # Verify deployment
        kubectl get pods -n fortress -l app=fortress-api

    - name: Run production smoke tests
      run: |
        # Wait for pods to be ready
        kubectl wait --for=condition=ready pod -l app=fortress-api -n fortress --timeout=600s
        
        # Get service URL
        SERVICE_URL=$(kubectl get service fortress-api-service -n fortress -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        
        # Run comprehensive smoke tests
        curl -f $SERVICE_URL/health || exit 1
        curl -f $SERVICE_URL/health/detailed || exit 1
        curl -f $SERVICE_URL/health/security || exit 1
        curl -f $SERVICE_URL/metrics || exit 1
        
        # Test GraphQL endpoint
        curl -f -X POST -H "Content-Type: application/json" \
          -d '{"query":"{ version }"}' \
          $SERVICE_URL/graphql || exit 1

    - name: Run load tests
      run: |
        # Install k6
        curl https://github.com/k6io/k6/releases/download/v0.47.0/k6-v0.47.0-linux-amd64.tar.gz | tar xz
        sudo mv k6-v0.47.0-linux-amd64/k6 /usr/local/bin/
        
        # Get service URL
        SERVICE_URL=$(kubectl get service fortress-api-service -n fortress -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        
        # Run load tests
        k6 run --vus 50 --duration 2m \
          --out json=load-test-results.json \
          -e BASE_URL=http://$SERVICE_URL \
          load-test.js

    - name: Upload load test results
      uses: actions/upload-artifact@v3
      with:
        name: load-test-results
        path: load-test-results.json

    - name: Notify on success
      if: success()
      run: |
        echo "🚀 Fortress API deployed successfully to production!"
        echo "Image: ${{ needs.build.outputs.image }}"
        echo "Digest: ${{ needs.build.outputs.digest }}"

    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Deployment failed!"
        echo "Please check the logs and rollback if necessary"

  # Security scan on deployed application
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run OWASP ZAP Baseline Scan
      run: |
        # Install ZAP
        docker pull owasp/zap2docker-stable
        
        # Get service URL
        SERVICE_URL=$(kubectl get service fortress-api-service -n fortress -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        
        # Run baseline scan
        docker run -t owasp/zap2docker-stable zap-baseline.py \
          -t http://$SERVICE_URL \
          -J zap-report.json || true
        
        # Upload results
        docker cp $(docker ps -q --latest):/zap/zap-report.json . || true

    - name: Upload security scan results
      uses: actions/upload-artifact@v3
      with:
        name: security-scan-results
        path: zap-report.json

    - name: Check for high vulnerabilities
      run: |
        if [ -f zap-report.json ]; then
          HIGH_COUNT=$(cat zap-report.json | jq '.site[].alerts[] | select(.riskid == "High") | length')
          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "❌ Found $HIGH_COUNT high severity vulnerabilities"
            exit 1
          else
            echo "✅ No high severity vulnerabilities found"
          fi
        fi
