name: Cloud Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  aws-tests:
    name: AWS Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'aws-tests')) && (github.repository == 'Genius740Code/Fortress' || github.event_name == 'workflow_dispatch')
    environment: testing
    env:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      KMS_KEY_ID: ${{ secrets.AWS_KMS_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-aws-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Configure AWS credentials
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set default.region $AWS_REGION
          
      - name: Create test S3 bucket
        run: |
          aws s3 mb s3://fortress-test-${{ github.run_number }} || true
          
      - name: Run AWS integration tests
        env:
          FORTRESS_AWS_REGION: ${{ env.AWS_REGION }}
          FORTRESS_S3_BUCKET: fortress-test-${{ github.run_number }}
          FORTRESS_KMS_KEY_ID: ${{ env.KMS_KEY_ID }}
        run: |
          cargo test --workspace --features aws,cloud-storage --no-fail-fast -- \
            test_aws_s3 \
            test_aws_kms \
            test_cloud_storage_integration
            
      - name: Cleanup test resources
        if: always()
        run: |
          aws s3 rb s3://fortress-test-${{ github.run_number }} --force || true

  azure-tests:
    name: Azure Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'azure-tests')) && (github.repository == 'Genius740Code/Fortress' || github.event_name == 'workflow_dispatch')
    environment: testing
    env:
      AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
      AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-azure-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          
      - name: Login to Azure
        run: |
          az login --service-principal \
            --tenant $AZURE_TENANT_ID \
            --username $AZURE_CLIENT_ID \
            --password $AZURE_CLIENT_SECRET
            
      - name: Run Azure integration tests
        env:
          FORTRESS_AZURE_STORAGE_ACCOUNT: ${{ env.AZURE_STORAGE_ACCOUNT }}
          FORTRESS_AZURE_STORAGE_KEY: ${{ env.AZURE_STORAGE_KEY }}
        run: |
          cargo test --workspace --features azure,cloud-storage --no-fail-fast -- \
            test_azure_blob \
            test_azure_key_vault \
            test_azure_storage_integration

  kubernetes-tests:
    name: Kubernetes Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'k8s-tests')) && (github.repository == 'Genius740Code/Fortress' || github.event_name == 'workflow_dispatch')
    environment: testing
    env:
      KUBECONFIG: ${{ github.workspace }}/kubeconfig
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-k8s-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Setup k3s
        run: |
          curl -sfL https://get.k3s.io | sh -s - --write-kubeconfig-mode 644
          sudo chmod 644 /etc/rancher/k3s/k3s.yaml
          sudo cp /etc/rancher/k3s/k3s.yaml $KUBECONFIG
          sudo chown $USER:$USER $KUBECONFIG
          
      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes
          
      - name: Build Fortress image
        run: |
          docker build -t fortress:test .
          
      - name: Load image into k3s
        run: |
          docker save fortress:test | sudo k3s ctr images import -
          
      - name: Deploy test resources
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Namespace
          metadata:
            name: fortress-test
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: fortress-test
            namespace: fortress-test
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: fortress-test
            template:
              metadata:
                labels:
                  app: fortress-test
              spec:
                containers:
                - name: fortress
                  image: fortress:test
                  imagePullPolicy: Never
                  ports:
                  - containerPort: 8080
          EOF
          
      - name: Wait for deployment
        run: |
          kubectl wait --for=condition=available --timeout=300s deployment/fortress-test -n fortress-test
          
      - name: Run Kubernetes integration tests
        env:
          FORTRESS_KUBECONFIG: ${{ env.KUBECONFIG }}
          FORTRESS_NAMESPACE: fortress-test
        run: |
          cargo test --workspace --features k8s --no-fail-fast -- \
            test_kubernetes_client \
            test_kubernetes_discovery \
            test_kubernetes_mesh
            
      - name: Cleanup test resources
        if: always()
        run: |
          kubectl delete namespace fortress-test --ignore-not-found=true

  performance-tests:
    name: Cloud Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [aws-tests, azure-tests]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    environment: testing
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-perf-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Run cloud performance benchmarks
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          cargo bench --workspace --features aws,azure,cloud-storage --no-fail-fast -- \
            cloud_storage_bench \
            cloud_encryption_bench \
            distributed_cache_bench
            
      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: cloud-performance-results
          path: target/criterion/
          retention-days: 30
