name: Publish Helm Chart

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Helm
      uses: azure/setup-helm@v3
      with:
        version: 'v3.13.0'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install packaging

    - name: Package Helm Chart
      run: |
        cd helm/fortress
        helm package .
        helm lint .

    - name: Create Index
      run: |
        mkdir -p gh-pages/charts
        
        # Download existing index if it exists
        if curl -s -o index.yaml https://helm.fortress-db.com/index.yaml; then
          echo "Existing index found"
        else
          echo "Creating new index"
          helm repo index . --url https://helm.fortress-db.com/charts
          mv index.yaml gh-pages/
        fi
        
        # Add new package to index
        mv *.tgz ../gh-pages/charts/
        cd ../gh-pages
        helm repo index ./charts --url https://helm.fortress-db.com/charts --merge index.yaml

    - name: Setup Pages
      uses: actions/configure-pages@v3

    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v2
      with:
        path: gh-pages

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2

    - name: Update Helm Repository
      run: |
        # Update the repository in-place if it exists
        gh repo edit fortress-db.com \
          --homepage "https://helm.fortress-db.com" \
          --description "Fortress Helm Repository" \
          --enable-issues=false \
          --enable-wiki=false || true

  test:
    runs-on: ubuntu-latest
    needs: publish
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Helm
      uses: azure/setup-helm@v3
      with:
        version: 'v3.13.0'

    - name: Test Chart Installation
      run: |
        # Wait for pages to be deployed
        sleep 60
        
        # Add the repository
        helm repo add fortress https://helm.fortress-db.com/charts --force-update
        
        # Test installation
        helm install test-fortress fortress/fortress \
          --namespace test \
          --create-namespace \
          --dry-run \
          --debug
        
        # Show chart info
        helm show chart fortress/fortress
        
        echo "✅ Helm chart test completed successfully"
