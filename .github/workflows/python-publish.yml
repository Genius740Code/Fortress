name: Publish Python Package

on:
  push:
    tags:
      - 'python-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true
        type: string

jobs:
  test:
    name: Test Python Package
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('crates/fortress-python/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin[patchelf] pytest pytest-asyncio pytest-cov
        cd crates/fortress-python
        pip install -e ".[dev]"
    
    - name: Run Rust checks
      run: |
        cd crates/fortress-python
        cargo fmt --all -- --check
        cargo clippy --all-targets --all-features -- -D warnings
        cargo test --lib
    
    - name: Build Python package
      run: |
        cd crates/fortress-python
        maturin build --release --out dist --strip
    
    - name: Run Python tests
      run: |
        cd crates/fortress-python
        pytest tests/ -v --cov=fortress --cov-report=xml
    
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: crates/fortress-python/coverage.xml
        flags: python
        name: python-${{ matrix.python-version }}

  build-wheels:
    name: Build Wheels
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Build wheels for ${{ matrix.os }}
      uses: PyO3/maturin-action@v1
      with:
        path: crates/fortress-python
        target: ${{ matrix.os == 'macos-latest' && 'universal2-apple-darwin' || '' }}
        args: --release --out dist --strip
        sccache: 'true'
        manylinux: auto
    
    - name: Upload wheels
      uses: actions/upload-artifact@v3
      with:
        name: wheels-${{ matrix.os }}
        path: crates/fortress-python/dist/

  build-sdist:
    name: Build Source Distribution
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Build sdist
      uses: PyO3/maturin-action@v1
      with:
        path: crates/fortress-python
        command: sdist
        args: --out dist
    
    - name: Upload sdist
      uses: actions/upload-artifact@v3
      with:
        name: sdist
        path: crates/fortress-python/dist/

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Download artifacts
      uses: actions/download-artifact@v3
    
    - name: Install twine
      run: pip install twine
    
    - name: Check packages
      run: |
        twine check --strict *
    
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload --skip-existing *
    
    - name: Create GitHub Release
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Python ${{ github.ref_name }}
        draft: false
        prerelease: false
        body: |
          ## Python Package Release
          
          This release includes the Python package for Fortress secure database system.
          
          ### Installation
          ```bash
          pip install fortress==${{ github.ref_name }}
          ```
          
          ### Changes
          See the [CHANGELOG](https://github.com/Genius740Code/Fortress/blob/main/CHANGELOG.md) for detailed changes.
          
          ### Verification
          ```bash
          # Verify installation
          python -c "import fortress; print(fortress.get_version())"
          
          # Run tests
          python -m pytest tests/
          ```

  publish-test:
    name: Publish to Test PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Download artifacts
      uses: actions/download-artifact@v3
    
    - name: Install twine
      run: pip install twine
    
    - name: Check packages
      run: |
        twine check --strict *
    
    - name: Publish to Test PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        TWINE_REPOSITORY_URL: https://test.pypi.org/legacy/
      run: |
        twine upload --skip-existing *
