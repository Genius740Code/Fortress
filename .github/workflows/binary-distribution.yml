name: Binary Distribution

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: fortress
            artifact_cli: fortress-cli
            artifact_server: fortress-api-server
            
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: fortress
            artifact_cli: fortress-cli
            artifact_server: fortress-api-server
            
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: fortress
            artifact_cli: fortress-cli
            artifact_server: fortress-api-server
            
          # macOS
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: fortress
            artifact_cli: fortress-cli
            artifact_server: fortress-api-server
            
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: fortress
            artifact_cli: fortress-cli
            artifact_server: fortress-api-server
            
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: fortress.exe
            artifact_cli: fortress-cli.exe
            artifact_server: fortress-api-server.exe
            
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.target }}
          
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
          
      - name: Build release
        run: |
          cargo build --workspace --release --target ${{ matrix.target }} --all-features
          
      - name: Strip binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          strip target/${{ matrix.target }}/release/${{ matrix.artifact_cli }}
          strip target/${{ matrix.target }}/release/${{ matrix.artifact_server }}
          
      - name: Create archive
        shell: bash
        run: |
          staging="fortress-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$staging"
          
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "$staging/"
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_cli }}" "$staging/"
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_server }}" "$staging/"
          cp README.md "$staging/"
          cp LICENSE "$staging/"
          
          tar czf "$staging.tar.gz" -C "$staging" .
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fortress-${{ matrix.target }}
          path: fortress-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          retention-days: 30

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
