apiVersion: v1
kind: ConfigMap
metadata:
  name: fortress-config
  namespace: fortress
  labels:
    app.kubernetes.io/name: fortress
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: fortress
data:
  fortress.toml: |
    # Fortress Configuration for Kubernetes
    
    [database]
    path = "/data/fortress.db"
    max_size = "10GB"
    cache_size = "256MB"
    pool_size = 20
    enable_wal = true
    
    [encryption]
    default_algorithm = "aes256gcm"
    key_rotation_interval = "168h"  # 7 days
    master_key_rotation_interval = "720h"  # 30 days
    
    [encryption.key_derivation]
    kdf = "argon2id"
    memory_cost = 262144  # 256 MiB
    iterations = 5
    parallelism = 8
    salt_length = 64
    
    [storage]
    backend = "filesystem"
    base_path = "/data"
    compression = true
    checksum = "sha512"
    
    [api]
    rest_port = 8080
    grpc_port = 50051
    enable_cors = true
    enable_wasm = true
    
    [api.rate_limit]
    requests_per_minute = 1000
    burst_size = 100
    
    [api.authentication]
    auth_type = "jwt"
    api_key_header = "X-Fortress-API-Key"
    
    [monitoring]
    enable_metrics = true
    metrics_port = 9090
    enable_tracing = true
    log_level = "info"
    
    # Cloud storage configuration (optional)
    # [storage.s3]
    # bucket = "fortress-data"
    # region = "us-west-2"
    
    # [storage.azure_blob]
    # container = "fortress-data"
