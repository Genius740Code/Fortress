apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fortress-server-hpa
  namespace: fortress
  labels:
    app.kubernetes.io/name: fortress
    app.kubernetes.io/component: hpa
    app.kubernetes.io/part-of: fortress
  annotations:
    metric-config.object.memory-request.config: '{"window":"30s"}'
    metric-config.object.cpu-request.config: '{"window":"30s"}'
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fortress-server
  minReplicas: 3
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "100"
  - type: Object
    object:
      metric:
        name: fortress_queue_depth
      describedObject:
        apiVersion: v1
        kind: Service
        name: fortress-server
      target:
        type: Value
        value: "1000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 5
        periodSeconds: 60
      selectPolicy: Max
