apiVersion: v1
kind: Secret
metadata:
  name: fortress-secrets
  namespace: fortress
  labels:
    app.kubernetes.io/name: fortress
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: fortress
  annotations:
    secret-manager.vault.hashicorp.com/agent-inject: "true"
    secret-manager.vault.hashicorp.com/role: "fortress"
    secret-manager.vault.hashicorp.com/agent-inject-secret-configmap: "fortress-config"
    kubernetes.io/service-account.name: "fortress-service-account"
type: Opaque
data:
  # Base64 encoded secrets - replace with actual values
  # Use: echo -n 'your-secret' | base64
  fortress-jwt-secret: <BASE64_ENCODED_JWT_SECRET>
  fortress-master-key: <BASE64_ENCODED_MASTER_KEY>
  fortress-db-password: <BASE64_ENCODED_DB_PASSWORD>
  fortress-api-key: <BASE64_ENCODED_API_KEY>
  fortress-node-id: <BASE64_ENCODED_NODE_ID>
  fortress-seed-nodes: <BASE64_ENCODED_SEED_NODES>
  fortress-hsm-cluster-id: <BASE64_ENCODED_HSM_CLUSTER_ID>
  fortress-backup-bucket: <BASE64_ENCODED_BACKUP_BUCKET>
  # Cloud storage credentials (optional)
  aws-access-key-id: <BASE64_ENCODED_AWS_ACCESS_KEY>
  aws-secret-access-key: <BASE64_ENCODED_AWS_SECRET_KEY>
  azure-storage-account: <BASE64_ENCODED_AZURE_ACCOUNT>
  azure-storage-key: <BASE64_ENCODED_AZURE_KEY>
  gcp-service-account: <BASE64_ENCODED_GCP_SERVICE_ACCOUNT>
stringData:
  # Certificate files (if using TLS)
  # tls.crt: |
  #   -----BEGIN CERTIFICATE-----
  #   ...
  #   -----END CERTIFICATE-----
  # tls.key: |
  #   -----BEGIN PRIVATE KEY-----
  #   ...
  #   -----END PRIVATE KEY-----
