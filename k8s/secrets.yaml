apiVersion: v1
kind: Secret
metadata:
  name: fortress-secrets
  namespace: fortress
  labels:
    app.kubernetes.io/name: fortress
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: fortress
type: Opaque
data:
  # Base64 encoded values
  # Use: echo -n 'your-secret' | base64
  fortress-jwt-secret: <BASE64_ENCODED_JWT_SECRET>
  fortress-master-key: <BASE64_ENCODED_MASTER_KEY>
  fortress-db-password: <BASE64_ENCODED_DB_PASSWORD>
  fortress-api-key: <BASE64_ENCODED_API_KEY>
  # Cloud storage credentials (optional)
  aws-access-key-id: <BASE64_ENCODED_AWS_ACCESS_KEY>
  aws-secret-access-key: <BASE64_ENCODED_AWS_SECRET_KEY>
  azure-storage-account: <BASE64_ENCODED_AZURE_ACCOUNT>
  azure-storage-key: <BASE64_ENCODED_AZURE_KEY>
