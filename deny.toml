# Cargo-deny configuration for Fortress security policy
# This file defines security policies for dependencies

[graph]
# The graph section configures the dependency graph processing
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-ms",
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
]

[advisories]
# The advisories section configures vulnerability detection
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# This is where we specify which vulnerability we accept
# For production, we should not accept any vulnerabilities
ignore = [
    # Example: 
    # "RUSTSEC-2020-0001",
]

# Alert on vulnerabilities, but don't fail the build
# Set to true to fail the build on vulnerabilities
severity-threshold = "medium"

# We want to be notified about vulnerabilities
unmaintained = "warn"
yanked = "warn"
notice = "warn"

[licenses]
# The licenses section configures license checking
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
]

# Licenses that we want to be warned about
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "AGPL-3.0",
]

# Copyleft licenses that we want to allow with exceptions
copyleft = "allow"

# License exceptions for specific crates
exceptions = [
    # Example:
    # { allow = ["GPL-3.0"], name = "some-gpl-crate" },
]

[bans]
# The bans section configures dependency banning
# This helps prevent duplicate dependencies and security issues

# Multiple versions of the same crate
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# Specific crates to deny
deny = [
    # Deny crates with known security issues
    { name = "openssl-sys", use-installed = true }, # Use system OpenSSL if available
    
    # Deny outdated cryptographic crates
    { name = "rust-crypto" }, # Use rustcrypto crates instead
    { name = "cryptsetup" }, # Outdated crypto library
    
    # Deny crates with unsafe code blocks (unless necessary)
    { name = "memmap", use-installed = true }, # Use system memmap if available
    
    # Deny debug dependencies in release builds
    { name = "pretty_assertions", deny-multiple-versions = true },
]

# Allow specific duplicate versions when necessary
allow = [
    # Allow multiple versions of tokio for compatibility
    { name = "tokio", version = "1.0" },
    { name = "serde", version = "1.0" },
    { name = "syn", version = "2.0" },
]

# Skip certain crates from version checking
skip = [
    # Skip system crates
    { name = "windows-sys", version = "0.48" },
    { name = "libc", version = "0.2" },
]

[sources]
# The sources section configures crate source validation
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# Security-specific configurations
[output]
# Output configuration for security reports
quiet = false
color = "auto"

# Format for security reports
format = "human"

# Where to write reports
# Can be "stdout", "stderr", or a file path
output-file = "security-report.txt"

# Additional security configurations
[config]
# General configuration for security policies

# Enable additional security checks
enable-all-features = false

# Default features to enable
default-features = true

# Features to avoid
avoid-breaking-changes = false

# Security-specific feature policies
[features]
# Feature-specific security policies

# Deny features that might compromise security
deny = [
    # Example: { name = "some-crate", feature = "insecure-feature" },
]

# Allow specific features even if they might be risky
allow = [
    # Example: { name = "some-crate", feature = "risky-but-necessary" },
]

# Private registry configuration (if applicable)
[private]
# Configuration for private registries

# Private registry URLs
registries = []

# Authentication for private registries
[private.auths]

# Example:
# "https://github.com/rust-lang/crates.io-index" = { token = "..." }

# Workspace-specific security policies
[workspace]
# Workspace-level security configuration

# Exclude certain crates from security checks
exclude = [
    # Example: "path/to/excluded/crate",
]

# Include only specific crates in security checks
include = [
    # Example: "path/to/included/crate",
]

# Advanced security configurations
[advanced]
# Advanced security configurations for enterprise deployments

# Enable advanced vulnerability detection
advanced-vulnerability-detection = true

# Enable dependency confusion protection
dependency-confusion-protection = true

# Enable supply chain security checks
supply-chain-security = true

# Enable cryptographic validation
crypto-validation = true

# Security metrics and reporting
[metrics]
# Configuration for security metrics

# Enable security metrics collection
enable-metrics = true

# Metrics collection endpoint
metrics-endpoint = "https://security-metrics.example.com"

# Metrics collection interval (in seconds)
metrics-interval = 300

# Security alerting configuration
[alerting]
# Configuration for security alerts

# Enable security alerts
enable-alerts = true

# Alert severity levels
alert-severity = ["high", "critical"]

# Alert endpoints
alert-endpoints = [
    "https://alerts.example.com/security",
]

# Alert formatting
alert-format = "json"

# Compliance configurations
[compliance]
# Configuration for compliance frameworks

# Enable compliance checking
enable-compliance = true

# Compliance frameworks to check
frameworks = [
    "SOC2",
    "PCI-DSS",
    "HIPAA",
    "GDPR",
]

# Compliance reporting
compliance-reporting = true

# Report generation interval (in hours)
report-interval = 24

# Audit trail configuration
[audit]
# Configuration for security audit trails

# Enable audit logging
enable-audit = true

# Audit log format
audit-format = "json"

# Audit log retention (in days)
log-retention = 365

# Audit log storage
log-storage = "secure-storage"

# Integration with external security tools
[integrations]
# Configuration for external security tool integrations

# SAST integration
sast-tools = [
    "semgrep",
    "codeql",
    "sonarqube",
]

# DAST integration
dast-tools = [
    "owasp-zap",
    "burp-suite",
]

# Container security
container-security = [
    "trivy",
    "clair",
    "grype",
]

# Infrastructure security
infrastructure-security = [
    "tfsec",
    "checkov",
    "prowler",
]

# Custom security rules
[custom-rules]
# Configuration for custom security rules

# Enable custom rules
enable-custom-rules = true

# Custom rule definitions
rules = [
    # Example:
    # {
    #     name = "no-hardcoded-secrets",
    #     pattern = "password.*=.*['\"][^'\"]*['\"]",
    #     severity = "high",
    #     message = "Hardcoded secrets detected",
    # },
]

# Rule files
rule-files = [
    "security-rules.toml",
    "custom-security-rules.toml",
]

# Security policy enforcement
[enforcement]
# Configuration for security policy enforcement

# Enable policy enforcement
enable-enforcement = true

# Enforcement actions
actions = [
    "block-build",
    "create-alert",
    "notify-team",
]

# Enforcement exceptions
exceptions = [
    # Example:
    # {
    #     rule = "no-hardcoded-secrets",
    #     crate = "test-crate",
    #     reason = "Test purposes only",
    #     expires = "2024-12-31",
    # },
]

# Security documentation
[documentation]
# Configuration for security documentation

# Generate security documentation
generate-docs = true

# Documentation format
doc-format = "markdown"

# Documentation output path
doc-output = "security-docs/"

# Include examples in documentation
include-examples = true

# Include best practices in documentation
include-best-practices = true
