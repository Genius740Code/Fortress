paths:
  /health:
    get:
      summary: Health check
      description: |
        Returns comprehensive health status of the Fortress server including:
        - Overall system health
        - Individual component status
        - Service uptime and version
        - Response times for each component
      tags:
        - Health
      responses:
        '200':
          description: Server health information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /version:
    get:
      summary: API version information
      description: |
        Returns detailed version information including:
        - API version and build number
        - Supported features and capabilities
        - Compatibility information
        - Deprecation notices
      tags:
        - Documentation
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'

  /api/v1/rate-limits:
    get:
      summary: Get rate limit status
      description: |
        Returns current rate limit status for the authenticated client.
        
        Information includes:
        - Remaining requests in current window
        - Rate limit quotas and limits
        - Window reset time
        - Rate limit tier information
      tags:
        - Authentication
      security:
        - jwt_auth: []
      responses:
        '200':
          description: Rate limit information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /openapi.json:
    get:
      summary: OpenAPI specification
      description: Returns the complete OpenAPI specification in JSON format
      tags:
        - Documentation
      responses:
        '200':
          description: OpenAPI specification
          content:
            application/json:
              schema:
                type: object

  /api/v1/auth/login:
    post:
      summary: Authenticate user
      description: |
        Authenticate a user and return JWT tokens for API access.
        
        The response includes:
        - Access token for API requests
        - Refresh token for obtaining new access tokens
        - User information and roles
        - Token expiration time
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many authentication attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      summary: Refresh access token
      description: |
        Refresh an access token using a refresh token.
        
        Use this endpoint to obtain a new access token without requiring
        the user to authenticate again.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/data:
    post:
      summary: Store encrypted data
      description: |
        Store data with automatic encryption and optional field-level security.
        
        Features:
        - **Automatic Encryption**: Data is encrypted using the specified algorithm
        - **Field-Level Security**: Optional per-field encryption with different algorithms
        - **Multi-Tenant Support**: Isolate data by tenant
        - **Metadata Support**: Attach custom metadata to stored data
        - **Key Management**: Use existing keys or generate new ones
        
        The response includes the data ID, encryption information, and metadata.
      tags:
        - Data Storage
      security:
        - jwt_auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreRequest'
      responses:
        '200':
          description: Data stored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreDataResponse'
        '400':
          description: Invalid request or data format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid or missing JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/data/bulk:
    post:
      summary: Bulk store encrypted data
      description: |
        Store multiple data items in a single request for improved efficiency.
        
        Features:
        - **Batch Processing**: Store up to 1000 items in one request
        - **Parallel Encryption**: Items are encrypted in parallel for performance
        - **Atomic Operations**: All items succeed or fail together
        - **Progress Tracking**: Real-time progress updates for large batches
        - **Error Isolation**: Individual item failures don't affect others
      tags:
        - Data Storage
      security:
        - jwt_auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkStoreRequest'
      responses:
        '200':
          description: Bulk data stored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkStoreResponse'
        '400':
          description: Invalid request or batch size exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request entity too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/data/bulk/{id}:
    get:
      summary: Bulk retrieve encrypted data
      description: |
        Retrieve multiple data items in a single request.
        
        Features:
        - **Batch Retrieval**: Retrieve up to 1000 items in one request
        - **Parallel Decryption**: Items are decrypted in parallel for performance
        - **Selective Fields**: Request only specific fields to reduce bandwidth
        - **Compression**: Automatic response compression for large datasets
      tags:
        - Data Storage
      security:
        - jwt_auth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Comma-separated list of data IDs to retrieve
          schema:
            type: string
            example: "id1,id2,id3"
        - name: fields
          in: query
          description: Comma-separated list of fields to retrieve (optional)
          schema:
            type: string
            example: "email,name"
      responses:
        '200':
          description: Bulk data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkRetrieveResponse'
        '400':
          description: Invalid request or too many IDs requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: One or more data items not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List stored data
      description: |
        Retrieve a paginated list of stored data with filtering and sorting options.
        
        Features:
        - **Pagination**: Control page size and navigate through results
        - **Filtering**: Filter by tenant, algorithm, date range, metadata
        - **Sorting**: Sort by creation date, size, or other fields
        - **Tenant Isolation**: Only return data accessible to the user's tenant
        
        Returns summary information without the actual data content.
      tags:
        - Data Storage
      security:
        - jwt_auth: []
      parameters:
        - name: tenant_id
          in: query
          description: Filter by tenant ID
          schema:
            type: string
        - name: page
