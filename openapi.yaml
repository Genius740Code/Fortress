              default: false
            trace:
              type: boolean
              description: Include evaluation trace
              default: false
      required:
        - input

    PolicyEvaluationResponse:
      type: object
      description: Policy evaluation response
      properties:
        decision:
          type: string
          description: Policy decision
          enum: [allow, deny]
          example: "allow"
        reason:
          type: string
          description: Reason for the decision
          nullable: true
          example: "User has admin role and access to resource"
        explanation:
          type: object
          description: Detailed explanation of the decision
          nullable: true
          properties:
            rules:
              type: array
