openapi: 3.0.3
info:
  title: Fortress API
  description: |
    REST API for Fortress secure database system with multi-layer encryption.
    
    ## Authentication
    API requests are authenticated using JWT tokens. Include token in Authorization header:
    ```
    Authorization: Bearer <your-jwt-token>
    ```
    
    ## Encryption
    All sensitive data is automatically encrypted before storage and decrypted after retrieval.
    
    ## Status
    **Alpha - Not Production Ready**
    
    ⚠️ **Not recommended for production workloads**
    - APIs may change without notice
    - Data migration tools are experimental
    - Security features are under audit
  version: 1.0.0
  contact:
    name: Fortress Team
    email: team@fortress-db.com
    url: https://fortress-db.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://api.fortress-db.com
    description: Production server (coming in v1.0)

paths:
  /health:
    get:
      summary: Health check
      description: Returns health status of Fortress server
      tags:
        - Health
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
                    example: "0.1.0"

  /openapi.json:
    get:
      summary: OpenAPI specification
      description: Returns the OpenAPI specification in JSON format
      tags:
        - Documentation
      responses:
        '200':
          description: OpenAPI specification
          content:
            application/json:
              schema:
                type: object

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "healthy"
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: "0.1.0"

tags:
  - name: Health
    description: Health check endpoints
  - name: Documentation
    description: API documentation and specification
