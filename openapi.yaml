              signature:
                type: string
                description: Cryptographic signature for integrity
                example: "signature_hash_here"
              merkle_proof:
                type: object
                description: Merkle tree proof for verification
                nullable: true
                properties:
                  leaf_index:
                    type: integer
                    format: int64
                  proof:
                    type: array
                    items:
                      type: string
