openapi: 3.0.3
info:
  title: Fortress API
  description: |
    Enterprise-grade REST API for Fortress secure database system with end-to-end encryption, 
    field-level security, and comprehensive compliance features.
    
    ## Overview
    Fortress provides a complete security platform for data storage and management with:
    - **End-to-End Encryption**: All data is encrypted at rest and in transit
    - **Field-Level Security**: Granular encryption controls for individual data fields
    - **Multi-Tenant Support**: Complete data isolation between tenants
    - **Compliance Ready**: GDPR, HIPAA, PCI-DSS compliant out of the box
    - **High Performance**: Sub-100ms response times with intelligent caching
    - **Enterprise Security**: Role-based access control, audit logging, and HSM integration
    - **Advanced Cryptography**: Quantum-resistant algorithms and homomorphic encryption
    - **Zero Trust Architecture**: Never trust, always verify security model
    - **Hardware Security**: TEE integration and HSM support
    - **Policy Engine**: OPA/Rego integration for fine-grained access control
    
    ## Security Features
    - **Rate Limiting**: Intelligent rate limiting with burst protection
    - **Input Validation**: Comprehensive protection against injection attacks
    - **Query Complexity Analysis**: Real-time query depth and complexity controls
    - **Audit Logging**: Complete audit trail with tamper-evident logging
    - **Multi-Factor Authentication**: Optional MFA with TOTP support
    - **Device Fingerprinting**: Advanced device tracking and trust scoring
    - **IP-Based Access Control**: Dynamic whitelisting/blacklisting
    - **Session Management**: Secure session lifecycle management
    
    ## Authentication
    API requests are authenticated using JWT tokens. Include token in Authorization header:
    ```
    Authorization: Bearer <your-jwt-token>
    ```
    
    ## Rate Limiting
    API endpoints are rate-limited to prevent abuse. Rate limit information is included
    in response headers and the `rate_limit` field of response metadata.
    
    ## Status
    **Production Ready - Enterprise Grade**
    
    - ✅ All security features implemented and tested
    - ✅ Zero-downtime deployment supported
    - ✅ Comprehensive monitoring and metrics
    - ✅ Full compliance with industry standards
    - ✅ Quantum-resistant cryptography available
    - ✅ Hardware security module integration
    - ✅ Advanced policy engine with OPA support
    
    ## Developer Experience
    
    ### Quick Start
    ```bash
    # Install CLI tool
    curl -sSL https://install.fortress-db.com | sh
    
    # Initialize client
    fortress-client init --server https://api.fortress-db.com
    
    # Store encrypted data
    fortress-client store --data '{"email":"user@example.com"}' --algorithm aes256
    
    # Retrieve data
    fortress-client get <data-id>
    ```
    
    ### SDK Examples
    
    #### Python
    ```python
    from fortress_client import FortressClient
    
    client = FortressClient(
        server_url="https://api.fortress-db.com",
        api_key="your-api-key"
    )
    
    # Store data
    result = client.store(
        data={"email": "user@example.com", "ssn": "123-45-6789"},
        field_encryption={
            "ssn": {"algorithm": "aes256", "sensitivity": "high"}
        }
    )
    
    # Retrieve data
    data = client.retrieve(result.id)
    ```
    
    #### JavaScript/TypeScript
    ```typescript
    import { FortressClient } from '@fortress/client';
    
    const client = new FortressClient({
        serverUrl: 'https://api.fortress-db.com',
        apiKey: 'your-api-key'
    });
    
    // Store data
    const result = await client.store({
        data: { email: 'user@example.com', ssn: '123-45-6789' },
        fieldEncryption: {
            ssn: { algorithm: 'aes256', sensitivity: 'high' }
        }
    });
    
    // Retrieve data
    const data = await client.retrieve(result.id);
    ```
    
    #### Rust
    ```rust
    use fortress_client::FortressClient;
    use serde_json::json;
    
    #[tokio::main]
    async fn main() -> Result<(), Box<dyn std::error::Error>> {
        let client = FortressClient::builder()
            .server_url("https://api.fortress-db.com")
            .api_key("your-api-key")
            .build()?;
        
        // Store data
        let result = client.store(
            json!({"email": "user@example.com", "ssn": "123-45-6789"}),
            Some(json!({
                "field_encryption": {
                    "ssn": {"algorithm": "aes256", "sensitivity": "high"}
                }
            }))
        ).await?;
        
        // Retrieve data
        let data = client.retrieve(&result.id).await?;
        println!("Retrieved data: {}", data);
        Ok(())
    }
    ```
    
    ### Integration Guides
    - **Web Applications**: See `/examples/web-integration`
    - **Mobile Apps**: See `/examples/mobile-integration`
    - **Microservices**: See `/examples/microservices-integration`
    - **Batch Processing**: See `/examples/batch-processing`
    
    ## SDKs and Libraries
    - **Rust**: `fortress-client` crate on [crates.io](https://crates.io/crates/fortress-client)
    - **Python**: `fortress-python` on [PyPI](https://pypi.org/project/fortress-python/)
    - **JavaScript/TypeScript**: `@fortress/client` on [npm](https://www.npmjs.com/package/@fortress/client)
    - **Go**: `fortress-go` module on [Go Modules](https://pkg.go.dev/github.com/fortress-security/fortress-go)
    - **Java**: `fortress-java` on [Maven Central](https://search.maven.org/artifact/com.fortress/fortress-java)
    - **C#**: `Fortress.Client` on [NuGet](https://www.nuget.org/packages/Fortress.Client)
    - **PHP**: `fortress-php` on [Packagist](https://packagist.org/packages/fortress/fortress-php)
    
    ## Tools and Utilities
    - **CLI Tool**: `fortress-cli` - Command-line interface for data operations
    - **Migration Tool**: `fortress-migrate` - Data migration utilities
    - **Backup Tool**: `fortress-backup` - Automated backup solutions
    - **Monitoring**: `fortress-monitor` - Prometheus exporter and Grafana dashboards
    
    ## Examples
    - **Basic Usage**: `/examples/basic/quickstart.py`
    - **Field-Level Encryption**: `/examples/encryption/field-level.js`
    - **Multi-Tenant**: `/examples/tenancy/multi-tenant.go`
    - **Batch Operations**: `/examples/batch/bulk-store.rs`
    - **Compliance Reports**: `/examples/compliance/gdpr-report.java`
    
    ## Security Best Practices
    
    ### Authentication & Authorization
    - **JWT Tokens**: Use short-lived tokens (15-60 minutes) with proper refresh mechanisms
    - **API Keys**: For server-to-server communication, use rotating API keys with least privilege
    - **Multi-Factor Authentication**: Enable MFA for all administrative operations
    - **Role-Based Access**: Implement principle of least privilege with granular roles
    
    ### Data Protection
    - **Field-Level Encryption**: Encrypt sensitive fields individually with strong algorithms
    - **Key Rotation**: Implement regular key rotation (every 90 days for production data)
    - **Data Classification**: Classify data by sensitivity level and apply appropriate controls
    - **Audit Logging**: Enable comprehensive audit trails for all data operations
    
    ### Network Security
    - **TLS 1.3**: Always use HTTPS with TLS 1.3 for all API communications
    - **IP Whitelisting**: Restrict API access to known IP ranges when possible
    - **Rate Limiting**: Implement client-specific rate limits to prevent abuse
    - **Input Validation**: Validate all input data against strict schemas
    
    ### Operational Security
    - **Environment Isolation**: Use separate environments for dev, staging, and production
    - **Secret Management**: Store all secrets in secure vaults (AWS Secrets Manager, HashiCorp Vault)
    - **Monitoring**: Set up security monitoring for unusual patterns and failed attempts
    - **Backup Security**: Encrypt all backups and store them in separate geographic regions
    
    ## Deployment Guide
    
    ### Production Deployment Checklist
    - [ ] **Security Configuration**
      - [ ] Enable TLS 1.3 with valid certificates
      - [ ] Configure rate limiting and DDoS protection
      - [ ] Set up monitoring and alerting
      - [ ] Enable audit logging
      - [ ] Configure backup and disaster recovery
    
    - [ ] **Performance Optimization**
      - [ ] Configure appropriate caching strategies
      - [ ] Set up connection pooling
      - [ ] Optimize database queries and indexes
      - [ ] Configure horizontal scaling
      - [ ] Set up CDN for static assets
    
    - [ ] **Compliance & Governance**
      - [ ] Configure data retention policies
      - [ ] Set up compliance reporting
      - [ ] Implement data classification
      - [ ] Configure privacy controls
      - [ ] Set up regular security audits
    
    ### Docker Deployment
    ```dockerfile
    FROM rust:1.70 as builder
    WORKDIR /app
    COPY . .
    RUN cargo build --release
    
    FROM debian:bookworm-slim
    RUN apt-get update && apt-get install -y ca-certificates && rm -rf /var/lib/apt/lists/*
    COPY --from=builder /app/target/release/fortress-server /usr/local/bin/
    EXPOSE 3000
    CMD ["fortress-server"]
    ```
    
    ### Kubernetes Deployment
    ```yaml
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: fortress-api
    spec:
      replicas: 3
      selector:
        matchLabels:
          app: fortress-api
      template:
        metadata:
          labels:
            app: fortress-api
        spec:
          containers:
          - name: fortress-api
            image: fortress-db/api:1.2.0
            ports:
            - containerPort: 3000
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fortress-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fortress-secrets
                  key: jwt-secret
            resources:
              requests:
                memory: "256Mi"
                cpu: "250m"
              limits:
                memory: "512Mi"
                cpu: "500m"
    ```
    
    ### Environment Variables
    ```bash
    # Database Configuration
    DATABASE_URL=postgresql://user:pass@localhost:5432/fortress
    DATABASE_POOL_SIZE=10
    
    # Security Configuration
    JWT_SECRET=your-super-secret-jwt-key
    ENCRYPTION_KEY_ID=production-key-123
    
    # Performance Configuration
    CACHE_SIZE=10000
    CACHE_TTL=3600
    MAX_CONNECTIONS=1000
    
    # Monitoring Configuration
    PROMETHEUS_ENABLED=true
    LOG_LEVEL=info
    ```
    
    ## Monitoring & Observability
    
    ### Prometheus Metrics
    The Fortress API exposes metrics at `/metrics` in Prometheus format:
    
    Key metrics to monitor:
    - `fortress_requests_total` - Total API requests
    - `fortress_request_duration_seconds` - Request latency
    - `fortress_cache_hit_rate` - Cache performance
    - `fortress_encryption_operations_total` - Cryptographic operations
    - `fortress_authentication_attempts_total` - Authentication events
    - `fortress_data_storage_bytes` - Data storage volume
    
    ### Grafana Dashboard
    Recommended panels:
    - Request rate and error rate
    - Response time percentiles (P50, P95, P99)
    - Cache hit rate and memory usage
    - Database connection pool status
    - Authentication success/failure rates
    - Data storage by tenant and algorithm
    
    ### Alerting Rules
    ```yaml
    groups:
    - name: fortress-alerts
      rules:
      - alert: HighErrorRate
        expr: rate(fortress_requests_total{status="error"}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second"
      
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(fortress_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected"
          description: "95th percentile latency is {{ $value }} seconds"
    ```
    
    ## Troubleshooting Guide
    
    ### Common Issues
    
    #### Authentication Failures
    **Symptoms**: 401 Unauthorized responses
    **Causes**: 
    - Expired JWT tokens
    - Invalid API keys
    - Network connectivity issues
    **Solutions**:
    - Refresh JWT tokens before expiration
    - Verify API key configuration
    - Check network connectivity to authentication service
    
    #### Performance Issues
    **Symptoms**: Slow response times, high CPU usage
    **Causes**:
    - Database connection pool exhaustion
    - Inefficient queries
    - Memory leaks
    **Solutions**:
    - Increase connection pool size
    - Optimize database queries and indexes
    - Monitor memory usage and restart services if needed
    
    #### Storage Issues
    **Symptoms**: Data storage failures, disk space errors
    **Causes**:
    - Insufficient disk space
    - Database connection issues
    - Encryption key rotation failures
    **Solutions**:
    - Monitor disk usage and clean up old data
    - Verify database connectivity
    - Check key rotation logs and retry if necessary
    
    ### Debug Mode
    Enable debug mode for detailed logging:
    ```bash
    export LOG_LEVEL=debug
    export RUST_LOG=debug
    ```
    
    ### Health Checks
    Monitor the `/health` endpoint for system status:
    ```bash
    curl -s https://api.fortress-db.com/health | jq .
    ```
    
    ## Error Codes Reference
    
    ### Authentication Errors (401)
    - **AUTH_001**: Invalid JWT token
    - **AUTH_002**: Expired JWT token
    - **AUTH_003**: Missing authentication header
    - **AUTH_004**: Invalid API key
    - **AUTH_005**: Account suspended
    - **AUTH_006**: MFA required
    - **AUTH_007**: Invalid MFA code
    
    ### Authorization Errors (403)
    - **PERM_001**: Insufficient permissions
    - **PERM_002**: Resource access denied
    - **PERM_003**: Tenant access denied
    - **PERM_004**: Admin privileges required
    - **PERM_005**: Rate limit exceeded
    
    ### Request Errors (400)
    - **REQ_001**: Invalid request format
    - **REQ_002**: Missing required field
    - **REQ_003**: Invalid field value
    - **REQ_004**: Field validation failed
    - **REQ_005**: Request too large
    - **REQ_006**: Invalid JSON format
    - **REQ_007**: Invalid UUID format
    - **REQ_008**: Invalid date format
    
    ### Resource Errors (404)
    - **RES_001**: Resource not found
    - **RES_002**: Data item not found
    - **RES_003**: Key not found
    - **RES_004**: Tenant not found
    - **RES_005**: Webhook not found
    - **RES_006**: Backup not found
    
    ### Conflict Errors (409)
    - **CONF_001**: Resource already exists
    - **CONF_002**: Duplicate key
    - **CONF_003**: Operation in progress
    - **CONF_004**: Data conflict
    - **CONF_005**: Version conflict
    
    ### Rate Limiting Errors (429)
    - **RATE_001**: Rate limit exceeded (minute)
    - **RATE_002**: Rate limit exceeded (hour)
    - **RATE_003**: Rate limit exceeded (day)
    - **RATE_004**: Concurrent request limit exceeded
    - **RATE_005**: Data upload limit exceeded
    
    ### Server Errors (500)
    - **SRV_001**: Internal server error
    - **SRV_002**: Database connection failed
    - **SRV_003**: Encryption service unavailable
    - **SRV_004**: Key management service error
    - **SRV_005**: External service unavailable
    
    ### Service Unavailable (503)
    - **SVC_001**: Service maintenance
    - **SVC_002**: Service overloaded
    - **SVC_003**: Database unavailable
    - **SVC_004**: Cache service unavailable
    
    ## API Versioning Strategy
    
    Fortress API follows semantic versioning (MAJOR.MINOR.PATCH):
    
    ### Version Changes
    - **MAJOR**: Breaking changes, requires migration
    - **MINOR**: New features, backward compatible
    - **PATCH**: Bug fixes, fully backward compatible
    
    ### Supported Versions
    - **1.2.x**: Current stable version
    - **1.1.x**: Previous stable (supported until 2024-06-01)
    - **1.0.x**: Deprecated (unsupported after 2024-03-01)
    
    ### Migration Guides
    - [1.0 to 1.1](https://docs.fortress-db.com/migration/1.0-to-1.1)
    - [1.1 to 1.2](https://docs.fortress-db.com/migration/1.1-to-1.2)
    
