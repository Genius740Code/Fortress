    # Cryptography Schemas
    TransitEncryptRequest:
      type: object
      description: Transit encryption request
      properties:
        plaintext:
          type: string
          description: Base64-encoded plaintext to encrypt
          example: "SGVsbG8gV29ybGQ="
        algorithm:
          type: string
          description: Encryption algorithm
          enum: [aegis256, aes256, chacha20]
          default: "aes256"
          nullable: true
        key_id:
          type: string
          description: Key ID for encryption (optional, generates new key if not specified)
          nullable: true
        context:
          type: string
          description: Additional context for encryption (AAD)
          nullable: true
        batch:
          type: array
          description: Batch encryption requests
          items:
            type: object
            properties:
              plaintext:
                type: string
              context:
                type: string
                nullable: true
          nullable: true
        tenant_id:
          type: string
          format: uuid
          description: Tenant ID for multi-tenant setups
          nullable: true
      required:
        - plaintext

    TransitEncryptResponse:
      type: object
      description: Transit encryption response
      properties:
        ciphertext:
          type: string
          description: Base64-encoded ciphertext
          example: "encrypted_data_here"
        key_id:
          type: string
          description: Key ID used for encryption
          example: "key_123456"
        algorithm:
          type: string
          description: Encryption algorithm used
          example: "aes256"
        encrypted_at:
          type: string
          format: date-time
          description: Encryption timestamp
          example: "2024-01-15T10:30:00Z"
        batch_results:
          type: array
          description: Batch encryption results
          items:
            type: object
            properties:
              ciphertext:
                type: string
              key_id:
                type: string
          nullable: true
      required:
        - ciphertext
        - key_id
        - algorithm
        - encrypted_at

    TransitDecryptRequest:
      type: object
      description: Transit decryption request
      properties:
        ciphertext:
          type: string
          description: Base64-encoded ciphertext to decrypt
          example: "encrypted_data_here"
        key_id:
          type: string
          description: Key ID used for encryption
          example: "key_123456"
        context:
          type: string
          description: Additional context used during encryption (AAD)
          nullable: true
        batch:
          type: array
          description: Batch decryption requests
          items:
            type: object
            properties:
              ciphertext:
                type: string
              key_id:
                type: string
              context:
                type: string
                nullable: true
          nullable: true
      required:
        - ciphertext
        - key_id

    TransitDecryptResponse:
      type: object
      description: Transit decryption response
      properties:
        plaintext:
          type: string
          description: Base64-encoded plaintext
          example: "SGVsbG8gV29ybGQ="
        algorithm:
          type: string
          description: Encryption algorithm used
          example: "aes256"
        decrypted_at:
          type: string
          format: date-time
          description: Decryption timestamp
          example: "2024-01-15T10:30:00Z"
        batch_results:
          type: array
          description: Batch decryption results
          items:
            type: object
            properties:
              plaintext:
                type: string
              algorithm:
                type: string
          nullable: true
      required:
        - plaintext
        - algorithm
        - decrypted_at

