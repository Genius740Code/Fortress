{{- if .Values.secrets.encryptionKey or .Values.secrets.jwtSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fortress.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fortress.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
type: Opaque
data:
  {{- if .Values.secrets.encryptionKey }}
  encryptionKey: {{ .Values.secrets.encryptionKey }}
  {{- end }}
  {{- if .Values.secrets.jwtSecret }}
  jwtSecret: {{ .Values.secrets.jwtSecret }}
  {{- end }}
{{- end }}
