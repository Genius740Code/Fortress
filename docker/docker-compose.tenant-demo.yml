version: '3.8'

services:
  fortress-server:
    build:
      context: ..
      dockerfile: crates/fortress-server/Dockerfile
    container_name: fortress-server
    ports:
      - "8080:8080"
    volumes:
      - fortress-data:/data
      - fortress-logs:/app/logs
      - ./demo-config:/config
    environment:
      - RUST_LOG=info
      - FORTRESS_DATA_DIR=/data
      - FORTRESS_SERVER_HOST=0.0.0.0
      - FORTRESS_SERVER_PORT=8080
      - FORTRESS_ENABLE_MULTI_TENANT=true
      - FORTRESS_MAX_TENANT_DATABASES=5
      - FORTRESS_MAX_TENANT_STORAGE=1073741824
      - FORTRESS_MAX_TENANT_CONNECTIONS=10
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - fortress-demo-network

  # Demo client for Tenant A
  tenant-a-client:
    build:
      context: ..
      dockerfile: docker/demo-client/Dockerfile
    container_name: tenant-a-client
    volumes:
      - fortress-data:/data
      - ./demo-scripts:/scripts
      - ./tenant-a-config:/config
    environment:
      - RUST_LOG=info
      - FORTRESS_DATA_DIR=/data
      - FORTRESS_SERVER_URL=http://fortress-server:8080
      - FORTRESS_TENANT_ID=tenant-a
      - FORTRESS_API_KEY=demo-tenant-a-key
    depends_on:
      fortress-server:
        condition: service_healthy
    command: ["sleep", "infinity"]
    networks:
      - fortress-demo-network

  # Demo client for Tenant B  
  tenant-b-client:
    build:
      context: ..
      dockerfile: docker/demo-client/Dockerfile
    container_name: tenant-b-client
    volumes:
      - fortress-data:/data
      - ./demo-scripts:/scripts
      - ./tenant-b-config:/config
    environment:
      - RUST_LOG=info
      - FORTRESS_DATA_DIR=/data
      - FORTRESS_SERVER_URL=http://fortress-server:8080
      - FORTRESS_TENANT_ID=tenant-b
      - FORTRESS_API_KEY=demo-tenant-b-key
    depends_on:
      fortress-server:
        condition: service_healthy
    command: ["sleep", "infinity"]
    networks:
      - fortress-demo-network

  # Admin client for tenant management
  admin-client:
    build:
      context: ..
      dockerfile: docker/demo-client/Dockerfile
    container_name: admin-client
    volumes:
      - fortress-data:/data
      - ./demo-scripts:/scripts
      - ./admin-config:/config
    environment:
      - RUST_LOG=info
      - FORTRESS_DATA_DIR=/data
      - FORTRESS_SERVER_URL=http://fortress-server:8080
      - FORTRESS_ADMIN_KEY=demo-admin-key
    depends_on:
      fortress-server:
        condition: service_healthy
    command: ["sleep", "infinity"]
    networks:
      - fortress-demo-network

  # PostgreSQL for tenant metadata storage
  postgres:
    image: postgres:15-alpine
    container_name: fortress-postgres
    environment:
      - POSTGRES_DB=fortress_tenants
      - POSTGRES_USER=fortress
      - POSTGRES_PASSWORD=fortress123
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-tenant-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortress -d fortress_tenants"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fortress-demo-network

  # Redis for session management and caching
  redis:
    image: redis:7-alpine
    container_name: fortress-redis
    command: redis-server --appendonly yes --requirepass fortress123
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - fortress-demo-network

volumes:
  fortress-data:
    driver: local
  fortress-logs:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  fortress-demo-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
