version: '3.8'

services:
  fortress-server:
    build:
      context: ..
      dockerfile: crates/fortress-server/Dockerfile
    container_name: fortress-server
    ports:
      - "8080:8080"
    volumes:
      - fortress-data:/data
      - fortress-logs:/app/logs
    environment:
      - RUST_LOG=info
      - FORTRESS_DATA_DIR=/data
      - FORTRESS_SERVER_HOST=0.0.0.0
      - FORTRESS_SERVER_PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - fortress-network

  fortress-cli:
    build:
      context: ..
      dockerfile: crates/fortress-cli/Dockerfile
    container_name: fortress-cli
    volumes:
      - fortress-data:/data
      - fortress-config:/config
    environment:
      - RUST_LOG=info
      - FORTRESS_DATA_DIR=/data
    depends_on:
      fortress-server:
        condition: service_healthy
    profiles:
      - tools
    networks:
      - fortress-network

  # PostgreSQL for optional backend storage
  postgres:
    image: postgres:15-alpine
    container_name: fortress-postgres
    environment:
      - POSTGRES_DB=fortress
      - POSTGRES_USER=fortress
      - POSTGRES_PASSWORD=fortress123
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortress -d fortress"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - postgres
    networks:
      - fortress-network

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: fortress-redis
    command: redis-server --appendonly yes --requirepass fortress123
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    profiles:
      - redis
    networks:
      - fortress-network

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: fortress-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    profiles:
      - monitoring
    networks:
      - fortress-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: fortress-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=fortress123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    restart: unless-stopped
    profiles:
      - monitoring
    networks:
      - fortress-network

volumes:
  fortress-data:
    driver: local
  fortress-logs:
    driver: local
  fortress-config:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  fortress-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
