[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))']
rustflags = [
    "-C", "opt-level=3",
    "-C", "lto=fat",
    "-C", "codegen-units=1",
    "-C", "panic=abort",
]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown", not(test))']
rustflags = [
    "-C", "opt-level=3",
    "-C", "lto=fat",
    "-C", "codegen-units=1",
    "-C", "panic=abort",
]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown", test))']
rustflags = [
    "-C", "opt-level=0",
    "-C", "debuginfo=1",
]
