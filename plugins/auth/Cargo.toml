[package]
name = "fortress-auth-plugins"
version = "1.0.0"
edition = "2021"
description = "WebAssembly authentication plugins for Fortress"
authors = ["Fortress Team"]
license = "GPL-3.0"
repository = "https://github.com/fortress-security/fortress"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
thiserror = "1.0"

[lib]
name = "fortress_auth_plugins"
path = "src/lib.rs"

# Binary targets disabled to avoid linking errors with undefined external functions
# These are WASM plugins and should be compiled separately
# Note: The bin/jwt_plugin.rs file exists but should not be compiled as a native binary

[features]
default = ["jwt", "oauth", "saml"]
jwt = []
oauth = []
saml = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"
