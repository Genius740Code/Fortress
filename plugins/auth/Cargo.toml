[package]
name = "fortress-auth-plugins"
version = "1.0.0"
edition = "2021"
description = "WebAssembly authentication plugins for Fortress"
authors = ["Fortress Team"]
license = "MIT"
repository = "https://github.com/fortress-security/fortress"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
thiserror = "1.0"

[lib]
name = "fortress_auth_plugins"
path = "src/lib.rs"

[[bin]]
name = "jwt_plugin"
path = "src/jwt_plugin.rs"

[[bin]]
name = "oauth_plugin" 
path = "src/oauth_plugin.rs"

[[bin]]
name = "saml_plugin"
path = "src/saml_plugin.rs"

[features]
default = ["jwt", "oauth", "saml"]
jwt = []
oauth = []
saml = []

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"
