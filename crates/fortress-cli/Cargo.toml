[package]

name = "fortress-cli"

version = "1.0.4"

edition = "2021"

authors = ["Genius740Code"]

license = "MIT"

description = "Command-line interface for Fortress secure database"



repository = "https://github.com/Genius740Code/Fortress"

keywords = ["cli", "database", "encryption", "security", "command-line"]

categories = ["command-line-utilities", "database"]



[[bin]]

name = "fortress"

path = "src/main.rs"



[dependencies]

# Core fortress library

fortress-core = { path = "../fortress-core", version = "1.0.1" }



# CLI framework

clap = { version = "4.4", features = ["derive", "env", "color"] }

crossterm = "0.27"

dialoguer = "0.11"

indicatif = "0.17"

console = "0.15"



# Async runtime

tokio = { version = "1.35", features = ["full"] }



# Serialization

serde = { version = "1.0", features = ["derive"] }

serde_json = "1.0"

toml = "0.8"



# Error handling

thiserror = "1.0"

anyhow = "1.0"

color-eyre = "0.6"



# Logging

tracing = "0.1"

tracing-subscriber = { version = "0.3", features = ["env-filter"] }



# Time and date

chrono = { version = "0.4", features = ["serde"] }

humantime = "2.1"



# File system

dirs = "5.0"

walkdir = "2.4"



# UUID generation

uuid = { version = "1.6", features = ["v4"] }



# HTTP client for plugin downloads

reqwest = { version = "0.12", features = ["json"] }



# HTTP server

hyper = { version = "0.14", features = ["full"] }

tower = "0.4"

tower-http = { version = "0.5", features = ["cors", "trace"] }



# Cryptography for checksums

sha2 = "0.10"



# Hex and Base64 encoding

hex = "0.4"

base64 = "0.21"



# Version parsing

semver = "1.0"



# Regular expressions

regex = "1.10"

# String similarity for suggestions
strsim = "0.11"



# CPU count

num_cpus = "1.16"

# Shell completions
clap_complete = "4.4"

# Async trait for trait objects
async-trait = "0.1"

# GraphQL support
async-graphql = { version = "7.0", features = ["chrono", "uuid"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# Additional utilities
indexmap = "2.0"
once_cell = "1.19"



[dev-dependencies]

tempfile = "3.8"

assert_cmd = "2.0"

