[package]
name = "fortress-db"
version = "1.0.0"
edition = "2021"
authors = ["Fortress Team <team@fortressdb.io>"]
license-file = "../../LICENSE"
description = "🛡️ Fortress - Turnkey Simplicity + Enterprise Security. A highly customizable, secure database system with multi-layer encryption."
homepage = "https://fortressdb.io"
repository = "https://github.com/Genius740Code/Fortress"
documentation = "https://github.com/Genius740Code/Fortress/blob/main/docs"
keywords = ["database", "encryption", "security", "cryptography", "privacy"]
categories = ["database", "cryptography"]
rust-version = "1.70"

[dependencies]
# Core Fortress library
fortress-core = { path = "../fortress-core", version = "1.0.0" }

# CLI tool
fortress-cli = { path = "../fortress-cli", version = "1.0.0", optional = true }

# Server components  
fortress-server = { path = "../fortress-server", version = "1.0.0", optional = true }

# NAPI bindings for Node.js
fortress-cli-napi = { path = "../fortress-cli-napi", version = "1.0.0", optional = true }

[features]
default = ["cli", "server"]
cli = ["fortress-cli"]
server = ["fortress-server"] 
napi = ["fortress-cli-napi"]
full = ["cli", "server", "napi"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
