[package]
name = "fortress-db"
version = "1.0.2"
edition = "2021"
authors = ["Genius740Code"]
license-file = "../../LICENSE"
description = "Fortress - Enterprise Security. A highly customizable, secure database system with multi-layer encryption."

repository = "https://github.com/Genius740Code/Fortress"
documentation = "https://github.com/Genius740Code/Fortress/blob/main/docs"
keywords = ["database", "encryption", "security", "cryptography", "privacy"]
categories = ["database", "cryptography"]
rust-version = "1.70"

[dependencies]
# Core Fortress library
fortress-core = { path = "../fortress-core", version = "1.0.1" }

# Serialization
serde_json = "1.0"

# UUID generation
uuid = { version = "1.6", features = ["v4"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# CLI tool
fortress-cli = { path = "../fortress-cli", version = "1.0.1", optional = true }

# Server components  
fortress-api-server = { path = "../fortress-api-server", version = "1.0.1", optional = true }

# NAPI bindings for Node.js
fortress-cli-napi = { path = "../fortress-cli-napi", version = "1.0.1", optional = true }

[features]
default = ["cli", "server"]
cli = ["fortress-cli"]
server = ["fortress-api-server"] 
napi = ["fortress-cli-napi"]
full = ["cli", "server", "napi"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
