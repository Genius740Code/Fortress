[metadata]
name = fortress
version = 0.1.0
author = Fortress Team
author_email = team@fortress-db.com
description = Python SDK for Fortress secure database system
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/Genius740Code/Fortress
project_urls =
    Bug Tracker = https://github.com/Genius740Code/Fortress/issues
    Documentation = https://docs.fortress-db.com
    Source Code = https://github.com/Genius740Code/Fortress
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    License :: OSI Approved :: Apache Software License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Rust
    Topic :: Database
    Topic :: Security :: Cryptography
    Topic :: Software Development :: Libraries :: Python Modules
    Typing :: Typed

[options]
packages = fortress
python_requires = >=3.8
include_package_data = True

[options.packages.find]
where = python

[options.extras_require]
dev =
    pytest>=7.0.0
    pytest-asyncio>=0.21.0
    black>=22.0.0
    isort>=5.10.0
    mypy>=1.0.0
    flake8>=5.0.0
    sphinx>=5.0.0
    sphinx-rtd-theme>=1.0.0
