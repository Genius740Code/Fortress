[build-system]
requires = ["setuptools>=61.0", "wheel", "maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "fortress-db"
version = "1.0.1-alpha.1"
description = "🛡️ Fortress - Turnkey Simplicity + Enterprise Security. Python SDK for Fortress secure database system with multi-layer encryption."
readme = "README.md"
license = {text = "Fortress Sustainable Use License 1.0"}
authors = [
    {name = "Fortress Team", email = "team@fortressdb.io"}
]
maintainers = [
    {name = "Fortress Team", email = "team@fortressdb.io"}
]
keywords = [
    "database", "encryption", "security", "privacy", "secure-storage", "aegis", "chacha20", "aes256", 
    "field-encryption", "key-rotation", "hsm", "compliance", "gdpr", "hipaa", "pci-dss", 
    "zero-trust", "enterprise", "cluster", "high-availability", "cryptography", "multi-tenant", 
    "audit", "rbac", "rust"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
    "aiohttp>=3.8.0",
    "typing-extensions>=4.5.0"
]
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.0.0",
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0"
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0"
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=1.0.0"
]
performance = [
    "pytest-benchmark>=4.0.0",
    "memory-profiler>=0.60.0"
]
dynamic = ["version"]

[project.urls]
Homepage = "https://fortressdb.io"
Documentation = "https://github.com/Genius740Code/Fortress/blob/main/docs"
Repository = "https://github.com/Genius740Code/Fortress"
"Bug Tracker" = "https://github.com/Genius740Code/Fortress/issues"
Changelog = "https://github.com/Genius740Code/Fortress/blob/main/CHANGELOG.md"
Discussions = "https://github.com/Genius740Code/Fortress/discussions"

[project.scripts]
fortress-db = "fortress_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fortress_db*"]

[tool.setuptools.package-data]
fortress_db = ["py.typed", "*.pyi"]

[tool.maturin]
python-source = "python"
module-name = "fortress_db._fortress"
features = ["pyo3/extension-module"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["fortress_db"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "fortress_db._fortress.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["fortress_db"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/.*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
