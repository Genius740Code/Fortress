[package]
name = "fortress-js"
version = "1.0.0-alpha"
edition = "2021"
authors = ["Fortress Team <team@fortressdb.io>"]
license = "Fortress Sustainable Use License 1.0"
description = "JavaScript/TypeScript bindings for Fortress secure database system"
homepage = "https://fortressdb.io"
repository = "https://github.com/Genius740Code/Fortress"
documentation = "https://fortressdb.io/docs"
keywords = ["database", "encryption", "security", "privacy", "secure-storage", "javascript", "typescript", "wasm"]
categories = ["database", "cryptography", "api-bindings", "wasm"]
rust-version = "1.70"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Fortress core
fortress-core = { path = "../fortress-core", version = "1.0.0-alpha" }

# Wasm bindings
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# Web APIs
web-sys = { version = "0.3", features = [
  "console",
  "Performance",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "Crypto",
  "SubtleCrypto",
  "CryptoKey",
  "AlgorithmIdentifier",
  "JsonWebKey",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

# Error handling
thiserror = "1.0"

# UUID
uuid = { version = "1.6", features = ["v4", "serde", "wasm-bindgen"] }

# Time and date
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

# Console logging
console_error_panic_hook = { version = "0.1", optional = true }

# Async utilities
futures = "0.3"

[features]
default = ["console_error_panic_hook"]
console_error_panic_hook = ["dep:console_error_panic_hook"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-simd"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
