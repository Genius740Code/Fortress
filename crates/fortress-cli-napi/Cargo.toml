[package]
name = "fortress-cli-napi"
version = "1.0.1"
edition = "2021"
authors = ["Genius740Code"]
license = "MIT"
description = "NAPI bindings for Fortress CLI"

repository = "https://github.com/Genius740Code/Fortress"
keywords = ["cli", "database", "encryption", "security", "napi"]
categories = ["command-line-utilities", "database"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Fortress core CLI - use as binary dependency
fortress-cli = { path = "../fortress-cli", version = "1.0.1", default-features = false, optional = true }

# NAPI bindings
napi = { version = "2.0", default-features = false, features = ["napi4"] }
napi-derive = "2.0"

# Minimal async runtime
tokio = { version = "1.35", features = ["rt"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Error handling
thiserror = "1.0"

[build-dependencies]
napi-build = "2.0"

[package.metadata.napi]
targets = ["x86_64-pc-windows-msvc"]

[features]
default = ["napi4"]
napi4 = ["napi/napi4"]
napi5 = ["napi/napi5"]
napi6 = ["napi/napi6"]
napi7 = ["napi/napi7"]
napi8 = ["napi/napi8"]
