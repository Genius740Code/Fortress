[package]

name = "fortress-core"

version = "1.0.6"

edition = "2021"

authors = ["Genius740Code"]

license = "MIT"

description = "Fortress Core Library - Enterprise Security. Core library for Fortress secure database system with multi-layer encryption."



repository = "https://github.com/Genius740Code/Fortress"

documentation = "https://github.com/Genius740Code/Fortress/blob/main/docs"

keywords = ["database", "encryption", "security", "cryptography", "privacy"]

categories = ["database", "cryptography"]

rust-version = "1.70"



[dependencies]

# Async runtime

tokio = { version = "1.35", features = ["rt", "sync", "macros"] }



# Serialization

serde = { version = "1.0", features = ["derive"] }

serde_json = "1.0"

serde_bytes = "0.11"

bincode = "1.3"

toml = "0.8"

serde_with = "3.4"

byteorder = "1.4"



# Cryptography

ring = "0.17"

chacha20poly1305 = "0.10"

aes-gcm = "0.10"

aes = "0.8"

block-modes = "0.9"

aegis = "0.9"

argon2 = "0.5"

blake3 = "1.5"

hkdf = "0.12"

password-hash = "0.5"



# Big integer arithmetic for homomorphic encryption

num-bigint = "0.4"

num-traits = "0.2"

num-integer = "0.1"



# Production homomorphic encryption dependencies

subtle = "2.5"  # Constant-time operations

zeroize = { version = "1.7", features = ["zeroize_derive"] }  # Secure memory handling



# Random number generation

rand = "0.8"

getrandom = "0.2"



# Compression

flate2 = "1.0"

lz4 = "1.24"



# Hashing

sha2 = "0.10"



# Web framework

warp = "0.3.7"

axum = "0.7"

tower = "0.4"

tower-http = "0.5"

sha3 = "0.10"

hmac = "0.12"

pbkdf2 = "0.12"

scrypt = "0.11"



# WebSocket support

tokio-tungstenite = "0.21"

tungstenite = "0.21"

futures-util = "0.3"

tokio-rustls = "0.24"

rustls = "0.21"

webpki-roots = "0.25"



# Error handling

thiserror = "1.0"

anyhow = "1.0"



# Lazy static initialization

lazy_static = "1.4"

once_cell = "1.19"



# Time and date

chrono = { version = "0.4", features = ["serde"] }

chrono-tz = "0.8"

time = "0.3"



# Cron scheduling

cron = "0.12"



# UUID

uuid = { version = "1.6", features = ["v4", "serde", "fast-rng"] }



# Async utilities

futures = "0.3"

async-trait = "0.1"



# Base64 encoding

base64 = "0.21"



# Hex encoding

hex = "0.4"

# Base32 encoding for TOTP

base32 = "0.5"



# File system traversal

walkdir = "2.5.0"



# Ed25519 digital signatures

ed25519-dalek = { version = "2.0", features = ["std"] }



# Curve25519 for elliptic curve cryptography

curve25519-dalek = "4.1"



# Bulletproofs for zero-knowledge proofs

bulletproofs = "4.0"



# Merlin for transcript protocols

merlin = "3.0"



# Generic array for cryptography

generic-array = "0.14"



# Logging

log = "0.4"

tracing = "0.1"

tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }

opentelemetry = { version = "0.21", features = ["trace"], optional = true }

opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"], optional = true }

tracing-opentelemetry = { version = "0.21", optional = true }

gethostname = { version = "0.4", optional = true }



# Derive macros

derive_builder = "0.12"

derive_more = { version = "0.99", features = ["from", "into", "display"] }



# Regular expressions

regex = "1.10"



# OPA/Rego policy engine support

rego = "0.1"

wasmtime = "19.0"



# IP network support

ipnetwork = "0.20"



# Human-readable duration parsing

humantime = "2.1"



# URL encoding

urlencoding = "2.1"



# Memory management

bytes = { version = "1.5", features = ["serde"] }



# LRU cache for barrier pattern

lru = "0.12"



# HSM and PKCS#11 support

# pkcs11 = { version = "0.5", optional = true }  # Commented out to use mock implementation

aws-sdk-cloudhsmv2 = { version = "0.28", optional = true }

aws-config = { version = "0.55", optional = true }

aws-types = { version = "0.55", optional = true }



# Cloud storage dependencies

aws-sdk-s3 = { version = "0.28", optional = true }

azure_storage = { version = "0.19", optional = true }

azure_storage_blobs = { version = "0.19", optional = true }

azure_identity = { version = "0.19", optional = true }



# Kubernetes dependencies

kube = { version = "0.88", features = ["client", "runtime"], optional = true }

k8s-openapi = { version = "0.21", features = ["v1_28"], optional = true }

trust-dns-resolver = { version = "0.23", features = ["tokio-runtime"], optional = true }

redis = { version = "0.24", features = ["tokio-comp", "connection-manager"], optional = true }



# Database dependencies

sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json", "migrate"] }



# HTTP client for plugin marketplace

reqwest = { version = "0.12", features = ["json"] }



# Archive support

tar = "0.4"

# Temporary file support

tempfile = "3.8"



# JWT support

jsonwebtoken = "9.2"



# Advanced authentication dependencies

totp-rs = "5.1"

qrcode = { version = "0.14", optional = true }

percent-encoding = { version = "2.3", optional = true }

user-agent-parser = { version = "0.3", optional = true }



dashmap = { version = "5.5", optional = true }

crossbeam = { version = "0.8", optional = true }

atomic = { version = "0.6", optional = true }

metrics = { version = "0.21", optional = true }

metrics-exporter-prometheus = { version = "0.12", optional = true }

parking_lot = { version = "0.12", optional = true }

rayon = { version = "1.8", optional = true }



# CPU core count detection

num_cpus = "1.16"



# System information monitoring

sysinfo = "0.30"



# Distributed caching (optional features)

memcached = { version = "0.4.5-beta.2", optional = true }



# Advanced profiling (optional)

pprof = { version = "0.12", features = ["flamegraph", "protobuf-codec"], optional = true }



[dev-dependencies]

criterion = { version = "0.5", features = ["html_reports"] }

proptest = "1.4"

quickcheck = "1.0"

tempfile = "3.8"

mockall = "0.12"

tokio-test = "0.4"



[features]

default = ["std"]

std = []

postgres = ["sqlx/postgres"]

mysql = ["sqlx/mysql"]

mssql = []  # SQL Server feature (currently not supported by sqlx 0.8)

k8s = ["kube", "k8s-openapi"]

cloud-storage = ["aws-sdk-s3", "aws-config", "aws-types"]

simd = []

hardware-acceleration = ["ring/std"]

fips = []

hsm = ["aws-sdk-cloudhsmv2", "aws-config", "aws-types"]  # Removed pkcs11 dependency

performance-optimization = ["dashmap", "crossbeam", "atomic", "metrics", "parking_lot", "rayon"]

distributed-cache = ["performance-optimization", "redis", "memcached"]

advanced-profiling = ["performance-optimization", "pprof", "tracing-subscriber"]

monitoring = ["performance-optimization", "metrics-exporter-prometheus"]

full-performance = ["performance-optimization", "distributed-cache", "advanced-profiling", "monitoring"]

observability = ["tracing-subscriber", "opentelemetry", "opentelemetry_sdk", "tracing-opentelemetry", "gethostname"]

experimental = []  # Experimental features

homomorphic-encryption = []  # Production-ready homomorphic encryption

advanced-authentication = ["qrcode", "percent-encoding", "user-agent-parser"]

# Phase 3 features

discovery = ["kube", "k8s-openapi", "trust-dns-resolver"]

mesh = ["kube", "k8s-openapi"]

rate-limiting = ["redis"]

phase3 = ["discovery", "mesh", "rate-limiting"]



[[bench]]

name = "encryption_bench"

harness = false

