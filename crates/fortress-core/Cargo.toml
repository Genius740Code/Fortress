[package]
name = "fortress-core"
version = "0.1.0"
edition = "2021"
authors = ["Fortress Team <team@fortress-db.com>"]
license = "Apache-2.0"
description = "Core library for Fortress secure database system"
homepage = "https://github.com/Genius740Code/Fortress"
repository = "https://github.com/Genius740Code/Fortress"
documentation = "https://docs.fortress-db.com"
keywords = ["database", "encryption", "security", "privacy", "vault"]
categories = ["database", "cryptography"]
rust-version = "1.70"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["rt", "sync", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"
serde_with = "3.4"

# Cryptography
ring = "0.17"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
aegis = "0.2"
argon2 = "0.5"
blake3 = "1.5"
hkdf = "0.12"
password-hash = "0.5"

# Random number generation
rand = "0.8"
getrandom = "0.2"

# Compression
flate2 = "1.0"
lz4 = "1.24"

# Hashing
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
scrypt = "0.11"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Time and date
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"

# UUID
uuid = { version = "1.6", features = ["v4", "serde", "fast-rng"] }

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Base64 encoding
base64 = "0.21"

# Hex encoding
hex = "0.4"

# Zeroize for secure memory handling
zeroize = { version = "1.7", features = ["zeroize_derive"] }

# Generic array for cryptography
generic-array = "0.14"

# Logging
log = "0.4"
tracing = "0.1"

# Derive macros
derive_builder = "0.12"
derive_more = { version = "0.99", features = ["from", "into", "display"] }

# Regular expressions
regex = "1.10"

# Human-readable duration parsing
humantime = "2.1"

# URL encoding
urlencoding = "2.1"

# Memory management
bytes = { version = "1.5", features = ["serde"] }
parking_lot = "0.12"

# HSM and PKCS#11 support
pkcs11 = "0.5"
aws-sdk-cloudhsmv2 = "0.28"
aws-config = "0.55"
aws-types = "0.55"

# Cloud storage dependencies
aws-sdk-s3 = { version = "0.28", optional = true }
azure_storage = { version = "0.19", optional = true }
azure_storage_blobs = { version = "0.19", optional = true }
azure_identity = { version = "0.19", optional = true }
google-cloud-storage = { version = "0.15", optional = true }
google-cloud-auth = { version = "0.13", optional = true }

# Additional dependencies for backup system
tempfile = "3.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
quickcheck = "1.0"
tempfile = "3.8"
mockall = "0.12"
tokio-test = "0.4"

[features]
default = ["std"]
std = []
cloud-storage = ["aws-sdk-s3", "azure_storage", "azure_storage_blobs", "azure_identity", "google-cloud-storage", "google-cloud-auth"]
simd = []
hardware-acceleration = ["ring/std"]
fips = []

[[bench]]
name = "encryption_bench"
harness = false
