[package]
name = "fortress"
version = "1.0.1"
edition = "2021"
authors = ["Genius740Code"]
license = "MIT"
description = "Fortress - + Enterprise Security. A highly customizable, secure database system with multi-layer encryption."
readme = "README.md"
repository = "https://github.com/Genius740Code/Fortress"
documentation = "https://github.com/Genius740Code/Fortress/blob/main/docs"
keywords = ["database", "encryption", "security", "cryptography", "privacy"]
categories = ["database", "cryptography"]
rust-version = "1.70"

autoexamples = false

[workspace]
members = [
    "crates/fortress-core",
    "crates/fortress-cli",
    "crates/fortress-api-server",
    "crates/fortress-cli-napi",
    "crates/fortress-db",
    "plugins/auth",
    # "crates/fortress-python",
    # "crates/fortress-js",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
# Async runtime
tokio = { version = "1.51.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
bincode = "1.3"

# Cryptography
ring = "0.17"
chacha20poly1305 = "0.10"
aegis = "0.2"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "mysql", "uuid", "chrono", "json"] }
# rocksdb = "0.21"

# Networking
axum = { version = "0.7", features = ["multipart"] }
tonic = "0.10"
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-br"] }
hyper = { version = "1.9.0", features = ["full"] }

# CLI
clap = { version = "4.4", features = ["derive", "env"] }
crossterm = "0.27"
dialoguer = "0.11"
indicatif = "0.17"
console = "0.15"

# Error handling
thiserror = "1.0"
anyhow = "1.0"
color-eyre = "0.6"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.21"
opentelemetry = { version = "0.21", features = ["trace"] }
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"] }

# Metrics and monitoring
metrics = "0.21"
metrics-exporter-prometheus = "0.12"

# Time and date
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"

# UUID
uuid = { version = "1.6", features = ["v4", "serde", "fast-rng"] }

# Configuration
config = "0.13"
env_logger = "0.10"

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Compression
flate2 = "1.0"
lz4 = "1.24"

# Memory management
bytes = "1.5"
parking_lot = "0.12"

# Regular expressions
regex = "1.10"

# Base64 encoding
base64 = "0.21"

# Hex encoding
hex = "0.4"

# Zeroize for secure memory handling
zeroize = { version = "1.7", features = ["zeroize_derive"] }

# Derive macros
derive_builder = "0.12"
derive_more = { version = "0.99", features = ["from", "into", "display"] }

# WebAssembly (optional) - moved to fortress-cli
fortress-cli = { path = "crates/fortress-cli", version = "1.0.1", optional = true }
# js-sys = { version = "0.3", optional = true }
# web-sys = { version = "0.3", optional = true, features = ["console", "ReadableStream"] }
# console_error_panic_hook = { version = "0.1", optional = true }

# HTTP client (for cloud storage)
reqwest = { version = "0.13.2", features = ["json", "stream"] }

# Kubernetes client (optional)
k8s-openapi = { version = "0.20", optional = true }
kube = { version = "0.88", optional = true }

# AWS SDK (optional)
aws-config = { version = "0.55", optional = true }
aws-sdk-s3 = { version = "0.28", optional = true }
aws-sdk-kms = { version = "0.28", optional = true }

# Azure SDK (optional)
azure_storage_blobs = { version = "0.12", optional = true }
azure_identity = { version = "0.12", optional = true }

# Google Cloud SDK (optional) - temporarily disabled due to web-sys conflict
# google-cloud-storage = { version = "0.6", optional = true }
# google-cloud-kms = { version = "0.6", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
quickcheck = "1.0"
tempfile = "3.8"
mockall = "0.12"
tokio-test = "0.4"
tracing-subscriber = "0.3"
test-case = "3.3"

# Example dependencies
fortress-core = { path = "crates/fortress-core", version = "1.0.1" }

[features]
default = []

# Performance features
simd = []
hardware-acceleration = ["ring/std"]

# Storage backends
aws = ["aws-config", "aws-sdk-s3", "aws-sdk-kms"]
azure = ["azure_storage_blobs", "azure_identity"]
# gcp = ["google-cloud-storage", "google-cloud-kms"]
# all-cloud = ["aws", "azure", "gcp"]
all-cloud = ["aws", "azure"]
cloud-storage = ["aws-config", "aws-sdk-s3", "aws-sdk-kms", "azure_storage_blobs", "azure_identity"]

# Database features
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
# mssql feature not available in sqlx 0.8
all-databases = ["postgres", "mysql"]

# Kubernetes features
k8s = ["k8s-openapi", "kube"]

# Security features
hsm = ["fortress-core/hsm"]
fips = []
homomorphic-encryption = ["fortress-core/homomorphic-encryption"]

# Development features
dev = ["tracing-subscriber/env-filter"]

# Note: fortress-core, fortress-cli, and fortress-server will be available as separate crates
# once they are published to crates.io

[profile.bench]
opt-level = 3
debug = true

[profile.dev]
opt-level = 0
debug = true

[lib]
name = "fortress"
path = "src/lib.rs"
crate-type = ["rlib"]

[[example]]
name = "working_plugin_example"
path = "examples/working_plugin_example.rs"

[[example]]
name = "simple_working_plugin"
path = "examples/simple_working_plugin.rs"

[[example]]
name = "testplugin_demo"
path = "examples/testplugin_demo.rs"

[[example]]
name = "testplugin_working_demo"
path = "examples/testplugin_working_demo.rs"

[workspace.dependencies]
# Shared workspace dependencies for consistent versions
tokio = "1.51.0"
serde = "1.0"
tracing = "0.1"
thiserror = "1.0"
uuid = "1.6"
chrono = "0.4"
anyhow = "1.0"
